name: Build & release

# Every push and pull request runs the tests on Windows, macOS and Linux.
# Pushing a version tag (git tag v0.1.0 && git push --tags) also builds the
# Windows, macOS and Linux downloads and publishes them on the Releases page.
# "Run workflow" on the Actions tab builds them without publishing (pick one
# platform or all of them); the files are then attached to that run.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Which download(s) to build
        type: choice
        default: all
        options: [all, linux, windows, macos]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  # Picks the build matrix: everything for a tag, or what "Run workflow" asked for.
  plan:
    name: Plan builds
    # Only for a version tag or a manual run - a normal push just runs the tests.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: python
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          import json, os
          targets = [
              {"family": "windows", "label": "Windows",       "os": "windows-latest", "optional": False},
              {"family": "macos",   "label": "macOS (Apple)", "os": "macos-latest",   "optional": False},
              # Intel Macs need their own build. Optional: if GitHub no longer
              # offers this runner, the rest still publishes.
              {"family": "macos",   "label": "macOS (Intel)", "os": "macos-15-intel", "optional": True},
              # Linux is built on the OLDEST supported Ubuntu on purpose: a
              # PyInstaller build runs on any distro with the same or a newer
              # glibc (Arch, current Ubuntu/Fedora/Debian...), never an older one.
              {"family": "linux",   "label": "Linux",         "os": "ubuntu-22.04",   "optional": False},
          ]
          wanted = os.environ["PLATFORM"]
          picked = [t for t in targets if wanted == "all" or t["family"] == wanted]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": picked}) + "\n")

  build:
    name: Build (${{ matrix.label }})
    needs: [test, plan]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0
      - run: python -m pip install -r requirements.txt
      - run: python packaging/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: GPUSA-${{ runner.os }}-${{ runner.arch }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
