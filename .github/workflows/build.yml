name: Build & release

# Every push and pull request runs the tests on Windows, macOS and Linux.
# Pushing a version tag (git tag v0.1.0 && git push --tags) also builds the
# Windows and macOS downloads and publishes them on the Releases page.
# "Run workflow" on the Actions tab builds them without publishing; the
# files are then attached to that run.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  build:
    name: Build (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows,        os: windows-latest,  optional: false }
          - { label: macOS (Apple),  os: macos-latest,    optional: false }
          # Intel Macs need their own build. Optional: if GitHub no longer
          # offers this runner, the rest still publishes.
          - { label: macOS (Intel),  os: macos-15-intel,  optional: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python packaging/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: GPUSA-${{ runner.os }}-${{ runner.arch }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
